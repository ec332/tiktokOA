# Folder ownership (plan 1.4). The most specific path wins.
# Stage UI panels live in web/src/panels/<stage>/ and are owned by that stage.
# Commits tagged "[<owner>] ..." may only touch that owner's paths.
current: I2
milestones: [M0, M1, M2, M3, M4, M5, M6, M7, M8, I2]  # I2 = iteration 2 (docs/iteration2/)
folders:
  # Skeleton (M0)
  - {path: pyproject.toml, owner: skeleton, milestone: M0}
  - {path: uv.lock, owner: skeleton, milestone: M0}
  - {path: tp/core, owner: skeleton, milestone: M0}
  - {path: tp/api, owner: skeleton, milestone: M0}
  - {path: tp/cli, owner: skeleton, milestone: M0}
  - {path: tests, owner: skeleton, milestone: M0}
  - {path: web, owner: skeleton, milestone: M0}
  - {path: docs, owner: skeleton, milestone: M0}
  - {path: .github, owner: skeleton, milestone: M0}
  # SUT workspace + env (M1)
  # No sut/upstream submodule: the profile points at a repo path or URL (docs/status/sut/001 D1).
  # sut/ (sut.yaml, requirements.md, patches/) moved to targets/fastapi-template/ in iteration 2
  # and is owned by `targets` below (docs/status/seams/001 D1).
  - {path: tp/core/sut.py, owner: sut, milestone: M1}
  - {path: tp/cli/sut.py, owner: sut, milestone: M1}
  - {path: tests/test_sut.py, owner: sut, milestone: M1}
  - {path: tp/stages/env, owner: env, milestone: M1}
  - {path: web/src/panels/env, owner: env, milestone: M1}
  # Specify (M2)
  - {path: tp/stages/spec, owner: spec, milestone: M2}
  - {path: web/src/panels/spec, owner: spec, milestone: M2}
  - {path: tp/stages/cases, owner: cases, milestone: M2}
  - {path: web/src/panels/cases, owner: cases, milestone: M2}
  # Build and prove (M3)
  - {path: tp/stages/generate, owner: generate, milestone: M3}
  - {path: web/src/panels/generate, owner: generate, milestone: M3}
  - {path: platform_rt, owner: generate, milestone: M3}
  - {path: images/runner, owner: generate, milestone: M3}
  - {path: images/runner-blackbox, owner: generate, milestone: I2}  # stage B (blackbox/001)
  - {path: tp/stages/gate, owner: gate, milestone: M3}
  - {path: web/src/panels/gate, owner: gate, milestone: M3}
  # Run, judge, report (M4)
  - {path: tp/stages/execute, owner: execute, milestone: M4}
  - {path: web/src/panels/execute, owner: execute, milestone: M4}
  - {path: tp/stages/triage, owner: triage, milestone: M4}
  - {path: web/src/panels/triage, owner: triage, milestone: M4}
  - {path: tp/stages/report, owner: report, milestone: M4}
  - {path: web/src/panels/report, owner: report, milestone: M4}
  # Retest (M5)
  - {path: tp/stages/retest, owner: retest, milestone: M5}
  - {path: web/src/panels/retest, owner: retest, milestone: M5}
  # Baseline (M6)
  - {path: tp/baseline, owner: baseline, milestone: M6}
  # Iteration 2 (I2). Stage A (seams) is cross-cutting: its call-site moves are committed under
  # the owning stage's tag, e.g. "[gate] A5: ..." (docs/status/seams/001).
  - {path: targets, owner: seams, milestone: I2}
  - {path: config, owner: seams, milestone: I2}
  - {path: tp/core/profile.py, owner: seams, milestone: I2}
  - {path: tp/core/strategies.py, owner: seams, milestone: I2}
  - {path: tp/core/priority.py, owner: seams, milestone: I2}
  - {path: tests/test_target_literals.py, owner: seams, milestone: I2}
  - {path: tests/target_literals_baseline.json, owner: seams, milestone: I2}
  - {path: tests/test_profile.py, owner: seams, milestone: I2}
