# Hand-written Memos profile (checks/001 D10): the conventions the generic families need, for the
# contract test against a scripted fake (platform_rt/tests/test_rt_families.py). Test input, not
# platform input. Stage D discovers the real profile from the repo and runs Memos live.
schema_version: 1
target:
  name: memos
  repo: https://github.com/usememos/memos
  type: api
commit_tested: b40d8a7b573774c52b022c8d6537d6baf2129dc0   # tag 26.11.0

# reach, spec and auth corrected to what discovery found on 26.11.0 (discover/004, r-0020):
# the base is /api (not /api/v1) and the release image is pulled, not built.
reach:
  source: override
  evidence: discover/004 r-0020 (scripts/compose.yaml, neosmemo/memos:stable retagged 26.11.0)
  value: {strategy: container, ref: 26.11.0, compose: scripts/compose.yaml, service: memos,
          port: 5230, image_tag_from: ref, health: /healthz}

spec:
  source: override
  evidence: proto/gen/openapi.yaml declares no security (master §4); not served
  value: {strategy: repo_file, openapi: proto/gen/openapi.yaml, base: /api}

auth:
  source: override
  evidence: the first user of an instance becomes its admin; found by probing in discover/004
  value:
    strategy: token_header
    scheme: Bearer
    check: /api/attachments
    login: {path: /api/auth/signin, json: true, token_field: accessToken,
            body: {passwordCredentials: {username: tpadmin, password: {secret: admin_password}}}}
    bootstrap: {path: /api/users, json: true,
                body: {username: tpadmin, password: {secret: admin_password}, role: ADMIN, state: NORMAL}}
    secured: {default: secured, public: [POST /api/auth/signin, POST /api/users],
              observed_open: [GET /api/identity-providers, GET /api/instance/profile]}

data:
  source: override
  evidence: "resource names (`memos/{memo}`) and pageSize/pageToken paging (master §4)"
  value:
    strategy: spec_derived
    id_field: name                 # POST /api/v1/memos -> {"name": "memos/abc", ...}
    id_style: string
    paging: {style: token, size: pageSize, token: pageToken}

state:
  source: override
  value: {strategy: namespace}

mutation:
  source: override
  value: {strategy: none}

safety:
  source: override
  value: {strategy: unrestricted}

checks:
  source: override
  value: {strategy: pytest_cases}
