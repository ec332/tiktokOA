[project]
name = "platform-rt"
version = "0.5.0"
description = "Test runtime for generated tests: recorded API client, expect helpers, reporter"
requires-python = ">=3.14"
dependencies = ["httpx", "pytest"]

[project.entry-points.pytest11]
platform_rt = "platform_rt.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_rt"]
