[project]
name = "testplat"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "typer",
    "pydantic",
    "pyyaml",
    "anthropic>=2.3.0",
]

[project.scripts]
tp = "tp.cli.main:app"

[dependency-groups]
dev = ["pytest", "ruff", "httpx", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tp"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]  # never reformat docs or the plan

[tool.pytest.ini_options]
testpaths = ["tests", "tp/stages", "platform_rt/tests"]
pythonpath = ["platform_rt"]  # host tests import the runtime from source; the runner gets the wheel
markers = ["docker: needs a running Docker daemon (skipped in CI)"]
